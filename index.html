<style>
:root{
  --bg:#0D1117;
  --bg-elevated:#161B22;
  --card:#1B212B;
  --card-2:#20293380;
  --border:#2A3341;
  --text:#F2F4F7;
  --text-dim:#9AA6B6;
  --accent:#F2A93B;
  --accent-ink:#241a05;
  --danger:#E14B3F;
  --urgent:#F2A93B;
  --traiter:#E8D24A;
  --info:#4FB477;
  --blue:#4A8FE0;
  --purple:#A47CE0;
  --gray:#6B7684;
  --radius:16px;
  --radius-sm:10px;
  --focus:#7CC4FF;
  font-size:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
h1,h2,h3{margin:0 0 4px 0;line-height:1.2;}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;}
h2{font-size:1.15rem;font-weight:750;}
h3{font-size:1rem;font-weight:700;color:var(--text-dim);}
p{line-height:1.45;margin:0 0 8px;}
a{color:var(--focus);}
button, .btn{

  cursor:pointer;
  border:none;
  color:var(--text);
  background:var(--card);
  border-radius:var(--radius);
  -webkit-appearance:none;
}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{

}
.topbar{

}
.topbar .back{

}
.topbar .title{flex:1;}
.topbar .title h1{font-size:1.2rem;}
.stat-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
.stat{

}
.stat b{display:block;font-size:1.4rem;font-weight:800;}
.stat span{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.big-btn{

}
.big-btn .ic{font-size:1.7rem;flex:none;width:36px;text-align:center;}
.big-btn .lbl{flex:1;}
.big-btn .badge{

  min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;padding:0 8px;
}
.big-btn.primary{

.big-btn.sms{

.big-btn.share{

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-btn{

.cat-btn .ic{font-size:2rem;}
.cat-btn.selected{border-color:var(--accent);background:#2a2210;}
.urg-btn{

textarea{min-height:90px;resize:vertical;}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border);}

.photo-thumb .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;width:22px;height:22px;border-radius:50%;font-size:.8rem;display:flex;align-items:center;justify-content:center;}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:750;margin:20px 0 10px;}
.section-title:first-child{margin-top:0;}
.lockscreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;}
.lockscreen .siren{font-size:3rem;}
.pindots{display:flex;gap:14px;margin:6px 0;}
.pindot{width:16px;height:16px;border-radius:50%;background:var(--card);border:1px solid var(--border);}
.pindot.filled{background:var(--accent);border-color:var(--accent);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:320px;}
.keypad button{padding:20px 0;font-size:1.4rem;font-weight:700;background:var(--card);border-radius:var(--radius);}
.keypad button.del{font-size:1.1rem;}
.wizard-steps{display:flex;gap:5px;margin-bottom:16px;}
.wizard-steps i{flex:1;height:4px;border-radius:2px;background:var(--border);}
.wizard-steps i.done{background:var(--accent);}
.link-btn{background:none;color:var(--focus);font-weight:650;padding:8px 0;}
.danger-btn{background:var(--danger);color:#fff;font-weight:750;}
.primary-full{width:100%;padding:16px;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem;margin-top:6px;}
.ghost-full{width:100%;padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);font-weight:650;margin-top:8px;}
.list-empty{text-align:center;color:var(--text-dim);padding:40px 16px;font-size:.95rem;}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;font-size:.8rem;color:var(--text-dim);}
.map-legend span{display:flex;align-items:center;gap:6px;}
.map-legend i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(255,255,255,.25);}
.map-toggle{display:flex;align-items:center;gap:9px;margin:10px 2px 14px;font-size:.9rem;color:var(--text);}
.map-toggle input{width:18px;height:18px;flex:none;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chip{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:.82rem;font-weight:650;}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
#offlineBanner{background:#3a2a12;color:var(--urgent);text-align:center;font-size:.78rem;font-weight:700;padding:6px;display:none;}
#offlineBanner.show{display:block;}
.admin-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;}
.admin-item .lbl{flex:1;}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;flex:none;font-size:1.1rem;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;color:#000;background:#fff;padding:24px;}
}
#printArea{display:none;}
</style>

<script>
"use strict";

/* ============================= CONSTANTES ============================= */

const STATUSES = [
  {id:"NOUVEAU", label:"Nouveau", emoji:"🔴", pill:"pill-danger"},
  {id:"PRIS_EN_CHARGE", label:"Pris en charge", emoji:"🔵", pill:"pill-blue"},
  {id:"EN_COURS", label:"Intervention en cours", emoji:"🟠", pill:"pill-urgent"},

  {id:"ARCHIVE", label:"Archivé", emoji:"📁", pill:"pill-gray"},
];
const OPEN_STATUSES = ["NOUVEAU","PRIS_EN_CHARGE","EN_COURS","PROGRAMMEE"];

const URGENCIES = [
  {id:"IMMEDIATE", label:"Urgence immédiate", emoji:"🔴", cls:"urg-immediate", pill:"pill-danger"},
  {id:"URGENT", label:"Urgent", emoji:"🟠", cls:"urg-urgent", pill:"pill-urgent"},
  {id:"A_TRAITER", label:"À traiter", emoji:"🟡", cls:"urg-traiter", pill:"pill-traiter"},

// Formulation courte utilisée dans le texte des SMS d'alerte (distincte des
// libellés plus longs affichés ailleurs dans l'application).
const SMS_URGENCY_TEXT = {
  IMMEDIATE: "🔴 Urgence immédiate",
  URGENT: "🟠 Urgence",
  A_TRAITER: "🟡 À traiter",
  INFO: "🟢 Information",
};

const DEFAULT_CATEGORIES = [
  {id:"voirie", emoji:"🚧", label:"Voirie", contactIds:["services_techniques","mairie"]},
  {id:"eclairage", emoji:"💡", label:"Éclairage", contactIds:["eclairage","mairie"]},
  {id:"eau", emoji:"💧", label:"Eau / Assainissement", contactIds:["eau","assainissement","mairie"]},
  {id:"arbre", emoji:"🌳", label:"Arbre / Espaces verts", contactIds:["services_techniques","espaces_verts","pompiers"]},
  {id:"batiment", emoji:"🏠", label:"Bâtiment communal", contactIds:["services_techniques","mairie"]},
  {id:"stade", emoji:"⚽", label:"Stade / Équipement", contactIds:["services_techniques","mairie"]},

  {id:"proprete", emoji:"🗑️", label:"Propreté / Dépôt", contactIds:["services_techniques","mairie"]},
  {id:"stationnement", emoji:"🚗", label:"Stationnement", contactIds:["police","mairie"]},
  {id:"inondation", emoji:"🌧️", label:"Inondation / Intempéries", contactIds:["services_techniques","pompiers","mairie"]},
  {id:"autre", emoji:"❓", label:"Autre", contactIds:["mairie"]},
];

const NATIONAL_CONTACTS = [
  {id:"pompiers", emoji:"🚒", name:"Pompiers", phone:"18", fixed:true},
  {id:"police", emoji:"🚓", name:"Police / Gendarmerie", phone:"17", fixed:true},
  {id:"samu", emoji:"🚑", name:"SAMU", phone:"15", fixed:true},

];
const DEFAULT_MUNICIPAL_CONTACTS = [
  {id:"mairie", emoji:"🏛️", name:"Mairie", phone:""},
  {id:"services_techniques", emoji:"🔧", name:"Services techniques", phone:""},
  {id:"eau", emoji:"💧", name:"Eau", phone:""},
  {id:"assainissement", emoji:"🚽", name:"Assainissement", phone:""},
  {id:"eclairage", emoji:"💡", name:"Éclairage public", phone:""},
  {id:"electricite", emoji:"⚡", name:"Électricité", phone:""},
  {id:"gaz", emoji:"🔥", name:"Gaz", phone:""},
  {id:"espaces_verts", emoji:"🌳", name:"Espaces verts", phone:""},
  {id:"entreprises_astreinte", emoji:"🔧", name:"Entreprises d'astreinte", phone:""},
];

const DEFAULT_CONSIGNES =
`En cas de danger immédiat : appeler les services d'urgence (18 / 17 / 112).

Photographier systématiquement le problème.

Noter l'heure et le lieu.

Informer le responsable selon la procédure communale.`;

const DEFAULT_USERS = [
  {id:"elu1", name:"Élu / agent 1"},
  {id:"elu2", name:"Élu / agent 2"},
  {id:"elu3", name:"Élu / agent 3"}
];

const PASLY_CENTER = {lat:49.4028, lng:3.3128};

/* ============================= INDEXEDDB ============================= */

const DB_NAME = "paslyAstreinteDB";
const DB_VERSION = 2;
let dbInstance = null;

function openDB(){
  return new Promise((resolve, reject) => {
    if(dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      const tx = e.target.transaction;
      if(!db.objectStoreNames.contains("incidents")){
        const s = db.createObjectStore("incidents", {keyPath:"uuid"});
        s.createIndex("status","status",{unique:false});
        s.createIndex("category","category",{unique:false});
        s.createIndex("createdAt","createdAt",{unique:false});
        s.createIndex("numero","numero",{unique:false});
      } else {
        // Migration : le numéro d'incident n'est plus garanti unique en base
        // (il peut désormais être généré hors connexion par plusieurs téléphones).
        const s = tx.objectStore("incidents");
        if(s.indexNames.contains("numero")){ s.deleteIndex("numero"); }
        s.createIndex("numero","numero",{unique:false});
      }
      if(!db.objectStoreNames.contains("kv")){
        db.createObjectStore("kv", {keyPath:"key"});
      }
    };
    req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function txStore(name, mode){
  return openDB().then(db => db.transaction(name, mode).objectStore(name));
}

function kvGet(key, fallback){
  return txStore("kv","readonly").then(store => new Promise((resolve,reject) => {
    const r = store.get(key);
    r.onsuccess = () => resolve(r.result ? r.result.value : fallback);
    r.onerror = () => reject(r.error);
  }));
}
function kvSet(key, value){
  return txStore("kv","readwrite").then(store => new Promise((resolve,reject) => {
    const r = store.put({key, value});
    r.onsuccess = () => resolve(true);
    r.onerror = () => reject(r.error);
  })).catch(err => { showToast("Erreur d'enregistrement — réessayez", true); throw err; });
}

function incidentPut(incident){
  return txStore("incidents","readwrite").then(store => new Promise((resolve,reject) => {
    const r = store.put(incident);
    r.onsuccess = () => resolve(incident);
    r.onerror = () => reject(r.error);
  })).catch(err => { showToast("Erreur d'enregistrement — réessayez", true); throw err; });
}
function incidentGet(uuid){
  return txStore("incidents","readonly").then(store => new Promise((resolve,reject) => {
    const r = store.get(uuid);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  }));
}
function incidentAll(){
  return txStore("incidents","readonly").then(store => new Promise((resolve,reject) => {
    const r = store.getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  }));
}
function incidentDelete(uuid){
  return txStore("incidents","readwrite").then(store => new Promise((resolve,reject) => {
    const r = store.delete(uuid);
    r.onsuccess = () => resolve(true);
    r.onerror = () => reject(r.error);
  }));
}

/* ============================= UTILITAIRES ============================= */

function esc(str){
  if(str === null || str === undefined) return "";
  const d = document.createElement("div");
  d.textContent = String(str);
  return d.innerHTML;
}
function uuid(){
  return (crypto.randomUUID) ? crypto.randomUUID() :
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0, v = c==="x"?r:(r&0x3|0x8);
      return v.toString(16);
    });
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function fmtDateTime(iso){
  const d = new Date(iso);
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} – ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function statusInfo(id){ return STATUSES.find(s=>s.id===id) || STATUSES[0]; }
function urgencyInfo(id){ return URGENCIES.find(u=>u.id===id) || URGENCIES[2]; }
function catInfo(id, categories){ return (categories||state.categories).find(c=>c.id===id) || {id, emoji:"❓", label:id}; }
function contactInfo(id, contacts){ return (contacts||state.allContacts).find(c=>c.id===id); }

let toastTimer=null;
function showToast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}

function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataURL){
  const [meta, b64] = dataURL.split(",");
  const mime = meta.match(/data:(.*?);base64/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

function compressImage(file, maxDim=1280, quality=0.7){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let {width, height} = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
        else { width = Math.round(width * maxDim/height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function ensurePins(){
  let salt = await kvGet("pinSalt", null);
  if(!salt){
    salt = uuid();
    await kvSet("pinSalt", salt);
  }
  let adminPinHash = await kvGet("adminPinHash", null);
  if(!adminPinHash){
    adminPinHash = await sha256Hex(salt + "9999");
    await kvSet("adminPinHash", adminPinHash);
  }
}

// Chaque élu/agent a désormais son propre code personnel (au lieu d'un code
// astreinte partagé). Migration automatique depuis l'ancien format
// (state.users = simples chaînes de caractères + un code commun "userPinHash").
async function ensureUsers(){
  const salt = await kvGet("pinSalt", "");
  let raw = await kvGet("users", null);
  let changed = false;
  if(!raw || !raw.length){
    raw = DEFAULT_USERS.map(u => ({...u}));
    changed = true;
  }
  raw = raw.map(u => (typeof u === "string") ? {id: uuid(), name: u} : {...u});
  for(const u of raw){
    if(!u.id){ u.id = uuid(); changed = true; }
    if(!u.pinHash){
      // Ancien code astreinte commun s'il existe, sinon code par défaut 1234.
      const legacy = await kvGet("userPinHash", null);
      u.pinHash = legacy || await sha256Hex(salt + "1234");
      changed = true;
    }
    if(u.phone === undefined){ u.phone = ""; changed = true; }
    if(u.smsAlerts === undefined){ u.smsAlerts = false; changed = true; }
    if(!u.smsUrgencies){
      u.smsUrgencies = {IMMEDIATE:true, URGENT:true, A_TRAITER:true, INFO:true};
      changed = true;
    }
  }
  if(changed){ await kvSet("users", raw); }
  state.users = raw;
}

function nav(hash, params){
  let h = "#" + hash;
  if(params) h += "?" + new URLSearchParams(params).toString();
  location.hash = h;
}
window.addEventListener("hashchange", render);

function parseHash(){
  const raw = location.hash.slice(1) || "home";
  const [route, qs] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs||""));
  return {route: route || "home", params};
}

function randHex(len){
  const bytes = new Uint8Array(Math.ceil(len/2));
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,len).toUpperCase();
}

function userCode(){
  const name = (state.currentUser || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  const words = name.split(/[^A-Z0-9]+/).filter(Boolean);
  if(words.length === 0) return "XX";
  if(words.length === 1) return words[0].slice(0,3);
  return words.map(w=>w[0]).join("").slice(0,4);
}

// Numéro lisible, généré localement sans compteur partagé : il combine la date,
// l'astreinte qui l'a créé et un suffixe aléatoire, pour éviter toute collision
// entre deux téléphones qui créeraient un incident au même moment hors connexion.
// L'identifiant réellement unique en base reste le uuid de l'incident.
function nextIncidentNumero(){
  const now = new Date();
  const datePart = `${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}`;
  return `AST-${datePart}-${userCode()}-${randHex(4)}`;
}

async function saveNewIncident(w){
  const now = new Date().toISOString();
  const numero = nextIncidentNumero();
  const incident = {
    uuid: uuid(),
    numero,
    category: w.category,
    urgency: w.urgency,
    lat: w.lat, lng: w.lng, address: w.address,
    photos: w.photos, // {phase, dataUrl, ts}
    description: w.description,
    reporterName: w.reporterName, reporterPhone: w.reporterPhone, reporterComment: w.reporterComment,
    status: "NOUVEAU",
    createdAt: now,
    createdBy: state.currentUser || null,
    history: [{ts: now, text: "Incident créé"}],
  };
  await incidentPut(incident);
  showToast("✅ Incident enregistré");
  return incident;
}

// Utilise uniquement le protocole natif "sms:" du téléphone : aucune API,
// aucun serveur, aucun abonnement. L'application Messages s'ouvre avec les
// destinataires et le texte préremplis ; c'est l'utilisateur qui appuie sur
// Envoyer. Fonctionne entièrement hors connexion.

function eligibleSmsUsers(){
  return state.users.filter(u => u.phone && u.phone.trim());
}

function defaultSmsRecipients(incident){
  return eligibleSmsUsers().filter(u => u.smsAlerts && u.smsUrgencies && u.smsUrgencies[incident.urgency]);
}

function buildIncidentSmsBody(incident){
  const cat = catInfo(incident.category);
  const urgText = SMS_URGENCY_TEXT[incident.urgency] || SMS_URGENCY_TEXT.A_TRAITER;
  const lines = ["🚨 NOUVEL INCIDENT", urgText, ""];
  lines.push(`${cat.emoji} ${cat.label}`);
  if(incident.description && incident.description.trim()){
    const desc = incident.description.trim();
    lines.push(desc.length > 140 ? desc.slice(0, 137) + "…" : desc);
  }
  const lieu = (incident.address && incident.address.trim())
    ? incident.address.trim()
    : (incident.lat != null ? `${incident.lat.toFixed(5)}, ${incident.lng.toFixed(5)}` : "");
  if(lieu){ lines.push(""); lines.push(`📍 ${lieu}`); }
  lines.push("");
  lines.push(`🆔 Incident : ${incident.numero}`);
  if(incident.reporterName && incident.reporterName.trim()){
    lines.push(`👤 Signalé par : ${incident.reporterName.trim()}`);
  }
  return lines.join("\n");
}

// Partage complet : dossier d'intervention pour transmission à un autre élu
// ou agent (plus détaillé que l'alerte courte ci-dessus, mais toujours sans
// rien inventer : chaque ligne n'apparaît que si l'information existe).
function buildIncidentShareSmsBody(incident){
  const cat = catInfo(incident.category);
  const urgText = SMS_URGENCY_TEXT[incident.urgency] || SMS_URGENCY_TEXT.A_TRAITER;
  const st = statusInfo(incident.status);
  const lines = ["🚨 INCIDENT PASLY ASTREINTE", "", `🆔 Incident : ${incident.numero}`, "", urgText, ""];
  lines.push(`${cat.emoji} ${cat.label}`);

  const lieu = (incident.address && incident.address.trim())
    ? incident.address.trim()
    : (incident.lat != null ? `${incident.lat.toFixed(5)}, ${incident.lng.toFixed(5)}` : "");
  if(lieu){ lines.push(""); lines.push(`📍 ${lieu}`); }

  if(incident.description && incident.description.trim()){
    const desc = incident.description.trim();
    lines.push("");
    lines.push(`⚠️ ${desc.length > 200 ? desc.slice(0,197) + "…" : desc}`);
  }

  if(incident.reporterName && incident.reporterName.trim()){
    lines.push("");
    lines.push(`👤 Signalé par : ${incident.reporterName.trim()}`);
    if(incident.reporterPhone && incident.reporterPhone.trim()){
      lines.push(`📞 ${incident.reporterPhone.trim()}`);
    }
  }

  lines.push("");
  lines.push(`📅 ${fmtDateTime(incident.createdAt)}`);
  lines.push(`📌 Statut : ${st.emoji} ${st.label}`);

  const takenBy = findStatusActor(incident, "PRIS_EN_CHARGE");
  if(takenBy){ lines.push(`👷 Pris en charge par : ${takenBy}`); }

  if((incident.history||[]).length){
    lines.push("");
    lines.push("Historique");
    incident.history.forEach(h=>{
      lines.push(`${fmtTime(h.ts)} — ${h.text}`);
    });
  }

  if((incident.photos||[]).length){
    lines.push("");
    lines.push(`📷 ${incident.photos.length} photo(s) dans le dossier`);
  }

  if(incident.lat != null){
    lines.push("");
    lines.push(`🗺️ https://www.google.com/maps?q=${incident.lat},${incident.lng}`);
  }

  // Garde le message raisonnablement court : au-delà, tronque l'historique
  // détaillé (déjà consultable dans l'application) plutôt que le reste.
  const MAX_LEN = 1400;
  let body = lines.join("\n");
  if(body.length > MAX_LEN){
    const withoutHistory = lines.filter(l => !/^\d{2}:\d{2} — /.test(l) && l !== "Historique");
    body = withoutHistory.join("\n");
    if(body.length > MAX_LEN){ body = body.slice(0, MAX_LEN - 1) + "…"; }
  }
  return body;
}

// iOS et Android n'utilisent pas exactement le même séparateur avant "body="
// dans le lien sms:. On adapte selon la plateforme détectée.
function buildSmsUri(phones, body){
  const nums = phones.map(p => p.replace(/[^\d+]/g, "")).filter(Boolean).join(",");
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const sep = isIOS ? "&" : "?";
  return `sms:${nums}${sep}body=${encodeURIComponent(body)}`;
}

  overlay.innerHTML = `
    <div class="sms-modal">

        `).join("")}
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="ghost-full" id="smsCancel" style="margin-top:0;">ANNULER</button>
        <button class="primary-full" id="smsOpen" style="margin-top:0;">OUVRIR LE SMS</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector("#smsCancel").addEventListener("click", ()=> overlay.remove());
  overlay.querySelector("#smsOpen").addEventListener("click", async ()=>{
    const chosenIds = Array.from(overlay.querySelectorAll("[data-smsuser]:checked")).map(el=>el.dataset.smsuser);
    const chosen = all.filter(u=>chosenIds.includes(u.id));
    if(!chosen.length){ showToast("Sélectionnez au moins un destinataire", true); return; }
    overlay.remove();
    const body = buildBody(incident);
    const phones = chosen.map(u=>u.phone.trim()).filter(Boolean);
    const uri = buildSmsUri(phones, body);
    incident.history.push({
      ts: new Date().toISOString(),
      text: `${historyLabel} (${chosen.map(u=>u.name).join(", ")})${state.currentUser ? ` · par ${state.currentUser}` : ""}`
    });
    try{ await incidentPut(incident); }catch(e){}
    window.location.href = uri;
    renderFiche({uuid: incident.uuid});
  });
}

async function addPhotosToIncident(uuid_, files, phase, params){
  const incident = await incidentGet(uuid_);
  for(const f of files){
    try{
      const blob = await compressImage(f);
      const dataUrl = await blobToDataURL(blob);
      incident.photos.push({phase, dataUrl, ts:new Date().toISOString()});
    }catch(e){ showToast("Erreur lors du traitement de la photo", true); }
  }
  incident.history.push({ts:new Date().toISOString(), text: phase==="apres" ? "Photo après intervention ajoutée" : "Photo ajoutée"});
  try{
    await incidentPut(incident);
    showToast("✅ Données enregistrées");
    renderFiche(params);
  }catch(e){ /* déjà notifié */ }
}

// Retrouve, si elle est connue, la personne ayant effectué un changement de
// statut donné (déduit de l'historique — jamais inventé : renvoie null si
// l'information n'a pas été enregistrée, par ex. pour un ancien incident).
function findStatusActor(incident, statusId){
  const label = statusInfo(statusId).label;
  const entries = (incident.history || []).filter(h => h.text && h.text.startsWith(`Statut : ${label}`));
  if(!entries.length) return null;
  const m = entries[entries.length - 1].text.match(/· par (.+)$/);
  return m ? m[1] : null;
}

async function renderHistorique(params){
  const all = (await incidentAll()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const filters = {
    q: params.q || "",
    status: params.status || "",
    category: params.category || "",
  };
  const filtered = all.filter(i=>{
    if(filters.status && i.status !== filters.status) return false;
    if(filters.category && i.category !== filters.category) return false;
    if(filters.q){
      const q = filters.q.toLowerCase();
      const hay = `${i.numero} ${i.address||""} ${i.description||""}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  app.innerHTML = `
    ${topbar("Historique", "home")}
    <div class="field"><input type="text" id="searchInput" placeholder="Rechercher (numéro, adresse, description)" value="${esc(filters.q)}"></div>
    <div class="chip-row" id="statusChips">
      <button class="chip ${!filters.status?'active':''}" data-status="">Tous statuts</button>
      ${STATUSES.map(s=>`<button class="chip ${filters.status===s.id?'active':''}" data-status="${s.id}">${s.emoji} ${esc(s.label)}</button>`).join("")}
    </div>
    <div class="chip-row" id="catChips">
      <button class="chip ${!filters.category?'active':''}" data-cat="">Toutes catégories</button>
      ${state.categories.map(c=>`<button class="chip ${filters.category===c.id?'active':''}" data-cat="${c.id}">${c.emoji} ${esc(c.label)}</button>`).join("")}
    </div>
    ${filtered.length ? `<div>${filtered.map(incidentRowHtml).join("")}</div>` : `<div class="list-empty">Aucun résultat.</div>`}
  `;
  document.getElementById("searchInput").addEventListener("input", debounce(e=>{
    nav("historique", {...filters, q:e.target.value});
  }, 350));
  document.querySelectorAll("#statusChips [data-status]").forEach(b=>b.addEventListener("click",()=>{
    nav("historique", {...filters, status:b.dataset.status});
  }));
  document.querySelectorAll("#catChips [data-cat]").forEach(b=>b.addEventListener("click",()=>{
    nav("historique", {...filters, category:b.dataset.cat});
  }));
}
function debounce(fn, ms){
  let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); };
}

let leafletLoadPromise = null;
function loadLeaflet(){
  if(leafletLoadPromise) return leafletLoadPromise;
  leafletLoadPromise = new Promise((resolve, reject)=>{
    if(window.L) return resolve(window.L);
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.crossOrigin = "anonymous";
    link.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(link);
    const script = document.createElement("script");
    script.crossOrigin = "anonymous";
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    script.onload = ()=>resolve(window.L);
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return leafletLoadPromise;
}

async function renderCarte(){
  const all = await incidentAll();
  const openOnly = await kvGet("carteOpenOnly", false);
  const geoAll = all.filter(i=>i.lat != null && (OPEN_STATUSES.includes(i.status) || i.status==="RESOLU"));
  const withGps = openOnly ? geoAll.filter(i=>OPEN_STATUSES.includes(i.status)) : geoAll;

  app.innerHTML = `
    ${topbar("Carte", "home")}
    <button class="ghost-full" id="btnMyPos" style="margin-top:0;">📍 Ma position</button>
    <label class="map-toggle"><input type="checkbox" id="openOnlyToggle" ${openOnly?'checked':''}> Incidents ouverts uniquement</label>
    <div id="mapBox" style="height:340px;border-radius:16px;overflow:hidden;background:var(--card);margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);text-align:center;padding:16px;">Chargement de la carte…</div>
    <div class="map-legend">
      <span><i style="background:#E14B3F"></i>🔴 Urgence immédiate</span>
      <span><i style="background:#F2A93B"></i>🟠 Urgent</span>
      <span><i style="background:#E8D24A"></i>🟡 À traiter</span>
      <span><i style="background:#4FB477"></i>🟢 Information</span>
      <span><i style="background:#6B7684"></i>⚫ Résolu</span>
    </div>
    <div class="section-title">Incidents géolocalisés (${withGps.length})</div>
    ${withGps.length ? withGps.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(incidentRowHtml).join("") : `<div class="list-empty">Aucun incident géolocalisé.</div>`}
  `;

  document.getElementById("openOnlyToggle").addEventListener("change", async (e)=>{
    await kvSet("carteOpenOnly", e.target.checked);
    renderCarte();
  });

  let map = null;
  document.getElementById("btnMyPos").addEventListener("click", ()=>{
    if(!map){ showToast("Carte indisponible hors connexion", true); return; }
    if(!navigator.geolocation){ showToast("Géolocalisation non disponible", true); return; }
    showToast("Recherche de votre position…");
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const {latitude, longitude} = pos.coords;
        map.setView([latitude, longitude], 16);
        window.L.circleMarker([latitude, longitude], {radius:8, color:"#fff", weight:2, fillColor:"#4A8FE0", fillOpacity:1})
          .addTo(map).bindPopup("Ma position").openPopup();
      },
      ()=> showToast("Impossible d'obtenir votre position", true),
      {enableHighAccuracy:true, timeout:10000}
    );
  });

  try{
    const L = await loadLeaflet();
    const box = document.getElementById("mapBox");
    box.textContent = "";
    box.style.display = "block";
    map = L.map(box).setView([PASLY_CENTER.lat, PASLY_CENTER.lng], 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors", maxZoom:19
    }).addTo(map);
    const colors = {IMMEDIATE:"#E14B3F",URGENT:"#F2A93B",A_TRAITER:"#E8D24A",INFO:"#4FB477"};
    withGps.forEach(i=>{
      const color = i.status==="RESOLU" ? "#6B7684" : colors[i.urgency];
      const marker = L.circleMarker([i.lat, i.lng], {radius:9, color:"#fff", weight:2, fillColor:color, fillOpacity:1}).addTo(map);
      marker.on("click", ()=> nav("fiche", {uuid: i.uuid}));
    });
  }catch(e){
    const box = document.getElementById("mapBox");
    box.innerHTML = "Carte indisponible hors connexion.<br><span style=\"font-size:.8rem;\">La liste ci-dessous reste consultable, et la carte se réaffichera automatiquement une fois déjà consultée en ligne.</span>";
  }
}

    }
    try{ await kvSet("municipalContacts", state.municipalContacts); showToast("✅ Données enregistrées"); nav("admin-contacts"); }catch(e){}
  });
}

function renderAdminConsignes(){
  app.innerHTML = `
    ${topbar("Consignes", "admin")}
    <div class="field"><textarea id="consignesInput" style="min-height:260px;">${esc(state.consignes)}</textarea></div>
    <button class="primary-full" id="saveConsignes">Enregistrer</button>
  `;

function renderAdminUsers(params){
  const editing = params && params.edit ? state.users.find(u=>u.id===params.edit) : null;
  if(editing || (params && params.edit === "__new")){ return renderAdminUserEdit(editing); }
  app.innerHTML = `
    ${topbar("Utilisateurs", "admin")}
    <p style="color:var(--text-dim);font-size:.85rem;">Chaque élu ou agent se connecte avec son nom et son code personnel à 4 chiffres. Le numéro de téléphone sert uniquement à préremplir les alertes SMS.</p>
    <div id="userList"></div>
    <button class="primary-full" id="addUser">➕ Ajouter un utilisateur</button>
  `;
  document.getElementById("userList").innerHTML = state.users.map(u=>`
    <div class="admin-item">
      <div class="lbl">
        ${esc(u.name)}
        <div style="font-size:.78rem;color:var(--text-dim);">${u.phone ? esc(u.phone) : "Téléphone non renseigné"}${u.smsAlerts ? " · 📱 SMS" : ""}</div>
      </div>
      <button class="iconbtn" data-edit="${esc(u.id)}" title="Modifier">✏️</button>
      <button class="iconbtn" data-reset="${esc(u.id)}" title="Réinitialiser le code">🔑</button>
      <button class="iconbtn" data-del="${esc(u.id)}" title="Supprimer">🗑️</button>
    </div>
  `).join("");
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>nav("admin-users", {edit:b.dataset.edit})));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", async ()=>{
    if(!confirm("Supprimer cet utilisateur ?")) return;
    state.users = state.users.filter(u=>u.id!==b.dataset.del);
    await kvSet("users", state.users);
    showToast("✅ Utilisateur supprimé");
    renderAdminUsers({});
  }));
  document.querySelectorAll("[data-reset]").forEach(b=>b.addEventListener("click", async ()=>{
    const v = prompt("Nouveau code personnel (4 chiffres) :");
    if(v === null) return;
    if(!/^\d{4}$/.test(v)){ showToast("Le code doit contenir 4 chiffres", true); return; }
    const salt = await kvGet("pinSalt","");
    const u = state.users.find(x=>x.id===b.dataset.reset);
    if(!u) return;
    u.pinHash = await sha256Hex(salt+v);
    try{ await kvSet("users", state.users); showToast("✅ Code modifié"); }catch(e){}
  }));
  document.getElementById("addUser").addEventListener("click", ()=>nav("admin-users", {edit:"__new"}));
}

function renderAdminUserEdit(editing){
  const isNew = !editing;
  const u = isNew
    ? {id:"", name:"", phone:"", smsAlerts:false, smsUrgencies:{IMMEDIATE:true,URGENT:true,A_TRAITER:true,INFO:true}}
    : editing;
  app.innerHTML = `
    ${topbar(isNew ? "Nouvel utilisateur" : "Modifier l'utilisateur", "admin-users")}
    <div class="field"><label>Nom</label><input type="text" id="uName" value="${esc(u.name)}" placeholder="Nom de l'élu ou de l'agent"></div>
    <div class="field"><label>Téléphone</label><input type="tel" id="uPhone" value="${esc(u.phone)}" placeholder="06 XX XX XX XX"></div>
    <div class="field">
      <label>${isNew ? "Code personnel (4 chiffres)" : "Nouveau code (laisser vide pour ne pas changer)"}</label>
      <input type="password" inputmode="numeric" maxlength="4" id="uPin" placeholder="4 chiffres">
    </div>
    <div class="section-title">Alertes SMS</div>
    <label class="map-toggle"><input type="checkbox" id="uSms" ${u.smsAlerts?'checked':''}> Recevoir les alertes SMS</label>
    <div id="uSmsUrgencies" style="margin:4px 0 6px;${u.smsAlerts?'':'opacity:.4;pointer-events:none;'}">
      ${URGENCIES.map(g=>`
        <label class="map-toggle" style="margin:6px 2px;">
          <input type="checkbox" data-urg="${g.id}" ${u.smsUrgencies && u.smsUrgencies[g.id] ? 'checked' : ''}> ${g.emoji} ${esc(g.label)}
        </label>
      `).join("")}
    </div>
    <button class="primary-full" id="saveUser">Enregistrer</button>
  `;
  document.getElementById("uSms").addEventListener("change", (e)=>{
    document.getElementById("uSmsUrgencies").style.opacity = e.target.checked ? "1" : ".4";
    document.getElementById("uSmsUrgencies").style.pointerEvents = e.target.checked ? "auto" : "none";
  });
  document.getElementById("saveUser").addEventListener("click", async ()=>{
    const name = document.getElementById("uName").value.trim();
    if(!name){ showToast("Le nom est obligatoire", true); return; }
    const phone = document.getElementById("uPhone").value.trim();
    const pin = document.getElementById("uPin").value;
    const smsAlerts = document.getElementById("uSms").checked;
    const smsUrgencies = {};
    URGENCIES.forEach(g=>{ smsUrgencies[g.id] = document.querySelector(`[data-urg="${g.id}"]`).checked; });
    if(isNew && !/^\d{4}$/.test(pin)){ showToast("Le code doit contenir 4 chiffres", true); return; }
    if(!isNew && pin && !/^\d{4}$/.test(pin)){ showToast("Le code doit contenir 4 chiffres", true); return; }
    const salt = await kvGet("pinSalt","");
    if(isNew){
      state.users.push({id: uuid(), name, phone, smsAlerts, smsUrgencies, pinHash: await sha256Hex(salt+pin)});
    } else {
      const idx = state.users.findIndex(x=>x.id===u.id);
      const pinHash = pin ? await sha256Hex(salt+pin) : u.pinHash;
      state.users[idx] = {...u, name, phone, smsAlerts, smsUrgencies, pinHash};
    }
    try{ await kvSet("users", state.users); showToast("✅ Données enregistrées"); nav("admin-users"); }catch(e){}
  });
}

    <p style="color:var(--text-dim);font-size:.85rem;">Les codes personnels de connexion des élus/agents se gèrent dans <b>Administration → Utilisateurs</b>.</p>

function renderAdminSauvegarde(){
  app.innerHTML = `
    ${topbar("Sauvegarde", "admin")}
    <button class="primary-full" id="exportBtn">💾 Exporter une sauvegarde</button>
    <div class="field" style="margin-top:16px;">
      <label>Restaurer une sauvegarde</label>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <button class="ghost-full" id="importBtn">📥 Restaurer</button>
    <p style="color:var(--text-dim);font-size:.82rem;margin-top:14px;">La restauration ajoute les incidents absents de l'appareil actuel (les doublons, identifiés par leur identifiant unique, sont ignorés).</p>
  `;
  document.getElementById("exportBtn").addEventListener("click", exportBackup);
  document.getElementById("importBtn").addEventListener("click", importBackup);
}

async function exportBackup(){
  try{
    const incidents = await incidentAll();
    const snapshot = {
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      communeName: state.communeName,
      logoDataUrl: state.logoDataUrl,
      mairieEmail: state.mairieEmail,
      categories: state.categories,
      municipalContacts: state.municipalContacts,
      consignes: state.consignes,
      users: state.users,
      incidents,
    };
    const blob = new Blob([JSON.stringify(snapshot)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pasly-astreinte-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("✅ Sauvegarde exportée");
  }catch(e){ showToast("Erreur lors de l'export", true); }
}

async function importBackup(){
  const file = document.getElementById("importFile").files[0];
  if(!file){ showToast("Choisissez un fichier de sauvegarde", true); return; }
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== "object" || !Array.isArray(data.incidents)){
      showToast("Fichier de sauvegarde invalide", true); return;
    }
    let added = 0, skipped = 0;
    const existing = await incidentAll();
    const existingIds = new Set(existing.map(i=>i.uuid));
    for(const inc of data.incidents){
      if(!inc.uuid || existingIds.has(inc.uuid)){ skipped++; continue; }
      await incidentPut(inc);
      added++;
    }
    if(Array.isArray(data.categories) && confirm("Remplacer aussi les catégories, contacts et consignes par ceux de la sauvegarde ?")){
      state.categories = data.categories; await kvSet("categories", state.categories);
      if(Array.isArray(data.municipalContacts)){ state.municipalContacts = data.municipalContacts; await kvSet("municipalContacts", state.municipalContacts); }
      if(data.consignes){ state.consignes = data.consignes; await kvSet("consignes", state.consignes); }
      if(Array.isArray(data.users)){ state.users = data.users; await kvSet("users", state.users); }
      if(data.communeName){ state.communeName = data.communeName; await kvSet("communeName", state.communeName); }
      if(data.mairieEmail){ state.mairieEmail = data.mairieEmail; await kvSet("mairieEmail", state.mairieEmail); }
    }
    showToast(`✅ Restauration terminée : ${added} incident(s) ajouté(s), ${skipped} ignoré(s)`);
  }catch(e){
    showToast("Erreur lors de la restauration du fichier", true);
  }
}

  try{
    await openDB();
    await ensurePins();
    await ensureUsers();
    await loadConfig();
  }catch(e){
    document.getElementById("app").innerHTML = "<p style='padding:24px;'>Erreur d'initialisation de l'application. Rechargez la page.</p>";
    return;
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
  render();
}
init();
